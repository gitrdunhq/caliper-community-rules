# caliper tfsec plugin configuration
# Place in .caliper/tfsec.config.yaml in your repo

scan_timeout: 120
terraform_version: null    # auto-detect, or pin: "1.5"
scan_modules: true         # scan referenced modules
allow_downloads: false     # don't download remote modules during scan

severity_map:
  CRITICAL: critical
  HIGH: high
  MEDIUM: warning
  LOW: info

# Minimum severity to report (skip noise)
minimum_severity: LOW

# Extra tfsec args
extra_args: ["--format", "json", "--force-all-dirs"]
