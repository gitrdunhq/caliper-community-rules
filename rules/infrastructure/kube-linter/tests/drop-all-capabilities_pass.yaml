# KIRBY-INF-016 — PASS case
# Compliant: capabilities.drop includes ALL, with only NET_BIND_SERVICE added back.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drop-caps-pass
  namespace: production
  labels:
    app: drop-caps-pass
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drop-caps-pass
  template:
    metadata:
      labels:
        app: drop-caps-pass
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          image: nginx:1.25
          securityContext:
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
