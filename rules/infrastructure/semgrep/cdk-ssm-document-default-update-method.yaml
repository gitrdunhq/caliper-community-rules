rules:
- id: cdk-ssm-document-default-update-method
  patterns:
  - pattern-either:
    - pattern: 'new $SSM.CfnDocument($SCOPE, $ID, { ... })'
    - pattern: 'new CfnDocument($SCOPE, $ID, { ... })'
  - pattern-not: 'new $SSM.CfnDocument($SCOPE, $ID, { ..., updateMethod: $M, ... })'
  - pattern-not: 'new CfnDocument($SCOPE, $ID, { ..., updateMethod: $M, ... })'
  message: 'AWS::SSM::Document defaults UpdateMethod to Replace, so every content change re-creates the
    document, discarding version history and any cross-account share. Set updateMethod: ''NewVersion''.'
  severity: WARNING
  languages:
  - typescript
  - javascript
  metadata:
    kirby_id: KIRBY-INF-038
    category: infrastructure
    subcategory: change-safety
    property-domain: reversibility
    eedom-plugin: semgrep
    compliance_mappings:
    - framework: nist-800-53-r5
      controls:
      - CM-3
      - CP-10
    references:
    - https://github.com/gitrdunhq/caliper/issues/499
