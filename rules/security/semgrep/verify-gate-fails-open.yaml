rules:
  - id: verify-gate-fails-open
    patterns:
      - pattern: |
          if [ -z "..." ] ...; then
            ...
            exit 0
          fi
      - metavariable-regex:
          metavariable: $...FILEPATH
          regex: .*release.*|.*verify.*|.*gate.*
    message: >
      Security verification step exits 0 when the expected value is
      missing. This means the gate fails open — an attacker who prevents
      the status from being posted can bypass verification entirely.
      Consider exiting non-zero or requiring the status to exist.
    languages: [bash]
    severity: WARNING
    metadata:
      category: security
      subcategory: fail-open-gate
      property-domain: integrity
      eedom-plugin: semgrep
      references:
        - https://github.com/gitrdunhq/eedom-community-rules
