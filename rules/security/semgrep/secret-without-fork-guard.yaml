rules:
  - id: secret-without-fork-guard
    pattern-regex: "secrets\\.[A-Z_]+"
    message: >
      Workflow step uses a repo secret but has no fork PR guard. Fork PRs
      don't have access to secrets, so this step will fail silently or
      leak the secret name in logs. Gate with:
      if: !(github.event.pull_request.head.repo.fork)
    languages: [yaml]
    severity: WARNING
    metadata:
      category: security
      subcategory: fork-safety
      property-domain: confidentiality
      eedom-plugin: semgrep
      references:
        - https://github.com/gitrdunhq/eedom-community-rules
